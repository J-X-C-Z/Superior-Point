name: Service Alpha
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  foundation:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: sp_test
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: sp_foundation_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U sp_test -d sp_foundation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sp_test:local-ci-only@127.0.0.1:5432/sp_foundation_test
      SP_TEST_PG_BIN: /usr/lib/postgresql/18/bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install matching PostgreSQL backup tools
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
      - run: npm run typecheck:service
      - run: npm run test:service
      - run: npm test
      - run: npm run build
