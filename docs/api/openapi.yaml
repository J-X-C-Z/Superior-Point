openapi: 3.1.0
info:
  title: Superior Point Service API
  version: 0.0.1
  description: >-
    Contract for routes currently registered by server/app.ts and
    server/routes/admin-routes.ts. This is an Alpha candidate API, not a
    production release. OAuth/OIDC and remote HTTP MCP are not implemented.
    Session-authenticated project and theme calls may send X-SP-Account-ID;
    if present, it must match the signed-in account or the service returns
    ACCOUNT_CHANGED. Theme package and rendering details are in docs/api/themes.md.
servers:
  - url: https://sp.example.invalid
    description: Replace with the configured service origin.
tags:
  - name: Public
  - name: Auth
  - name: Projects
  - name: Themes
  - name: Tokens
  - name: Admin
paths:
  /health/live:
    get:
      tags: [Public]
      summary: Liveness probe
      responses:
        '200': {description: Process is live}
  /health/ready:
    get:
      tags: [Admin]
      summary: Authenticated database readiness probe
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Database query succeeded}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/public/config:
    get:
      tags: [Public]
      summary: Read public site settings
      responses:
        '200': {description: Public settings}
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [username, password]
              properties:
                username: {type: string, minLength: 3, maxLength: 64}
                password: {type: string, minLength: 1, maxLength: 1024, format: password}
      responses:
        '200': {description: User, CSRF token, and session cookie}
        '401': {$ref: '#/components/responses/Error'}
        '429': {$ref: '#/components/responses/Error'}
  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: Read the current account
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Current user}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/csrf:
    post:
      tags: [Auth]
      summary: Rotate browser CSRF token
      security: [{sessionCookie: []}]
      responses:
        '200': {description: New CSRF token}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/auth/reauth:
    post:
      tags: [Auth]
      summary: Reauthenticate the current user
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [password], properties: {password: {type: string, format: password}}}
      responses:
        '200': {description: Reauthentication accepted}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/auth/password:
    post:
      tags: [Auth]
      summary: Change the current password
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [currentPassword, newPassword], properties: {currentPassword: {type: string, format: password}, newPassword: {type: string, minLength: 12, maxLength: 1024, format: password}}}
      responses:
        '200': {description: Password changed}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: End the current session
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Session ended and cookie cleared}
  /api/v1/me/tokens:
    get:
      tags: [Tokens]
      summary: List the current user's personal access tokens
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Token metadata; secret values are not returned}
    post:
      tags: [Tokens]
      summary: Create a personal access token
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name: {type: string}
                scopes:
                  type: array
                  uniqueItems: true
                  maxItems: 9
                  items: {type: string, enum: [projects:read, projects:create, projects:write, projects:delete, projects:export, assets:write, themes:read, themes:write, themes:publish]}
                projectAllowlist:
                  oneOf:
                    - {type: 'null'}
                    - {type: array, uniqueItems: true, maxItems: 1000, items: {type: string}}
                expiresAt: {type: string, maxLength: 64}
      responses:
        '201': {description: Token metadata and one-time secret value}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/me/tokens/{id}:
    delete:
      tags: [Tokens]
      summary: Revoke one of the current user's tokens
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Token revoked}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Projects]
      summary: List the current user's projects
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters:
        - {name: trash, in: query, schema: {type: boolean}, description: Include or select trashed projects}
      responses:
        '200': {description: Project summaries}
    post:
      tags: [Projects]
      summary: Create a project
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                title: {type: string, maxLength: 500}
                canvas: {type: object, additionalProperties: false, required: [width, height], properties: {width: {type: number, exclusiveMinimum: 0}, height: {type: number, exclusiveMinimum: 0}}}
      responses:
        '201': {description: Created project}
        '400': {$ref: '#/components/responses/Error'}
  /api/v1/projects/import:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Projects]
      summary: Import a document as a new project
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [document, clientMutationId], properties: {document: {type: object}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '201': {description: Imported project}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/themes:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Themes]
      summary: List the current user's private themes
      description: Requires themes:read for personal access tokens. Returns metadata only; archived and trash select the corresponding library records.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters:
        - {name: archived, in: query, schema: {type: boolean}}
        - {name: trash, in: query, schema: {type: boolean}}
      responses:
        '200': {description: Private theme metadata array; package and asset bytes are not included}
        '403': {$ref: '#/components/responses/Error'}
    post:
      tags: [Themes]
      summary: Import a private theme package
      description: Requires themes:write for personal access tokens. Creates a new server identity and preserves the supplied local package.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [theme, clientMutationId], properties: {theme: {type: object, description: Validated schema-v1 Superior Point theme package}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '201': {description: Saved private theme with fixed package reference}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/themes/import:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Themes]
      summary: Import a private theme package
      description: Alias of POST /api/v1/themes.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [theme, clientMutationId], properties: {theme: {type: object, description: Validated schema-v1 Superior Point theme package}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '201': {description: Saved private theme with fixed package reference}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/themes/builtins:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Themes]
      summary: List read-only built-in themes
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Built-in theme catalog metadata}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/themes/builtin/{id}:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Themes]
      summary: Read one built-in theme fixed reference
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Read-only built-in package reference with snapshot}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/themes/preview:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Themes]
      summary: Render four static theme preview samples
      description: Requires themes:read for personal access tokens. Static SVG uses the generic renderer; font and chart output may differ from the editor.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [themeId, version, hash], properties: {themeId: {type: string, minLength: 1, maxLength: 128}, version: {type: string, minLength: 1, maxLength: 64}, hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}, ratio: {type: string, enum: ['16:9', '4:3']}}}
      responses:
        '200': {description: Four static SVG slides, verified theme reference, compatibility report, and limitations}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/themes/{id}:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    get:
      tags: [Themes]
      summary: Read a private theme and its current fixed reference
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Private theme metadata and fixed package reference}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Themes]
      summary: Rename, archive, or restore a private theme library entry
      description: Requires themes:write. A rename changes the library label; published snapshots remain fixed.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, clientMutationId], properties: {name: {type: string, minLength: 1, maxLength: 200}, archived: {type: boolean}, expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '200': {description: Updated private theme metadata}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Themes]
      summary: Soft-delete a private theme
      description: Requires themes:write. Retains immutable versions and document snapshots.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, clientMutationId], properties: {expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '200': {description: Deleted theme metadata}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/themes/{id}/versions/{version}:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}, {name: version, in: path, required: true, schema: {type: string}}]
    get:
      tags: [Themes]
      summary: Read an immutable private theme version
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Fixed theme reference including snapshot and hash}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/themes/{id}/publish:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    post:
      tags: [Themes]
      summary: Publish a new immutable version of an owned theme
      description: Requires themes:publish. Existing versions cannot be overwritten; expectedRevision uses library metadata CAS.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [theme, expectedRevision, clientMutationId], properties: {theme: {type: object, description: Validated schema-v1 Superior Point theme package}, expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '200': {description: Newly published immutable theme version}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/themes/{id}/favorite:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    post:
      tags: [Themes]
      summary: Favorite a private theme
      description: Requires themes:write for personal access tokens. Idempotent.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Updated favorite relationship and theme metadata}
        '403': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Themes]
      summary: Remove a private theme favorite
      description: Requires themes:write for personal access tokens. Idempotent.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Updated favorite relationship and theme metadata}
        '403': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    get:
      tags: [Projects]
      summary: Read a project summary/document
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Project document and revision}
        '404': {$ref: '#/components/responses/Error'}
    patch:
      tags: [Projects]
      summary: Rename a project
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses:
        '200': {description: Updated project}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Move a project to trash
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses:
        '200': {description: Updated project}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/document:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    get:
      tags: [Projects]
      summary: Read a project document
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{name: trash, in: query, schema: {type: boolean}}]
      responses:
        '200': {description: Document and revision}
    patch:
      tags: [Projects]
      summary: Apply document operations
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, clientMutationId, operations], properties: {expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}, leaseToken: {type: string}, operations: {type: array, minItems: 1, maxItems: 1000, items: {type: object}}}}
      responses:
        '200': {description: Updated document}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/theme:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    post:
      tags: [Projects, Themes]
      summary: Apply a fixed private or built-in theme to a project
      description: Requires projects:write and themes:read for personal access tokens. Preserve is the default; reset is explicit. Uses one project revision commit and the existing lease rules.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [themeId, version, hash, expectedRevision, clientMutationId], properties: {themeId: {type: string, minLength: 1, maxLength: 128}, version: {type: string, minLength: 1, maxLength: 64}, hash: {type: string, pattern: '^sha256:[a-f0-9]{64}$'}, mode: {type: string, enum: [preserve, reset], default: preserve}, expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}, leaseToken: {type: string, minLength: 1, maxLength: 128}}}
      responses:
        '200': {description: Committed project document and new revision}
        '403': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/snapshot:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    put:
      tags: [Projects]
      summary: Replace document with a full snapshot under an active lease
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, clientMutationId, leaseToken, document], properties: {expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}, leaseToken: {type: string}, document: {type: object}}}
      responses:
        '200': {description: Snapshot saved}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/slides:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Projects]
      summary: List slides
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Slides and project revision}
  /api/v1/projects/{id}/slides/{slideId}:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Projects]
      summary: Read one slide
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {name: slideId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: Slide and project revision}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/slides/{slideId}/render:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Projects]
      summary: Render a static SVG preview
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}, {name: slideId, in: path, required: true, schema: {type: string}}]
      responses:
        '200': {description: SVG string, MIME type, revision, compatibility report, and limitations}
  /api/v1/projects/{id}/validate:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    get:
      tags: [Projects]
      summary: Validate a project document
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Validation findings and render compatibility}
  /api/v1/projects/{id}/exports:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Projects]
      summary: Export editable or audience HTML
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [expectedRevision, format], properties: {expectedRevision: {$ref: '#/components/schemas/Revision'}, format: {type: string, enum: [editable-html, audience-html]}}}
      responses:
        '200': {description: HTML, MIME type, revision, and compatibility report}
        '409': {$ref: '#/components/responses/Error'}
        '422': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/restore:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Projects]
      summary: Restore a trashed project
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses:
        '200': {description: Restored project}
  /api/v1/projects/{id}/revisions:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    get:
      tags: [Projects]
      summary: List project revision metadata
      description: Requires projects:read. Returns descending metadata only; it does not include documents or assets. Deleted projects cannot be read.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Descending revision records with revision, title, source, createdAt, and slideCount}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/revisions/{revision}:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}, {name: revision, in: path, required: true, schema: {type: string, pattern: '^[0-9]+$'}}]
    get:
      tags: [Projects]
      summary: Read one immutable project revision
      description: Requires projects:read. Revision path values are decimal digits and must be safe nonnegative integers.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      responses:
        '200': {description: Historical SPDocument snapshot}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/revision-diff:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    get:
      tags: [Projects]
      summary: Compare two project revisions structurally
      description: Requires projects:read. Slides and elements are reported by added, removed, or modified identity; this is not a field-by-field document diff.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
        - {name: to, in: query, required: true, schema: {type: string, pattern: '^[0-9]+$'}}
      responses:
        '200': {description: Structural slide, element, order, title, asset, and theme change report}
        '400': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/restore-revision:
    parameters: [{$ref: '#/components/parameters/accountPin'}, {$ref: '#/components/parameters/id'}]
    post:
      tags: [Projects]
      summary: Restore historical content as a new project revision
      description: Requires projects:write and a valid exclusive lease. The requested revision must be older than current. Restore never rewrites history; failure commits no snapshot.
      security: [{sessionCookie: []}, {personalAccessToken: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [revision, expectedRevision, clientMutationId, leaseToken], properties: {revision: {$ref: '#/components/schemas/Revision'}, expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}, leaseToken: {type: string, minLength: 1, maxLength: 128}}}
      responses:
        '200': {description: Restored document as a new current revision}
        '400': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/projects/{id}/lease:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Projects]
      summary: Acquire a short-lived write lease
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [holder], properties: {holder: {type: string, minLength: 1}}}
      responses:
        '200': {description: Lease token and expiration}
        '409': {$ref: '#/components/responses/Error'}
    delete:
      tags: [Projects]
      summary: Release a write lease
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [leaseToken], properties: {leaseToken: {type: string}}}
      responses:
        '200': {description: Lease released}
  /api/v1/projects/{id}/lease/renew:
    parameters: [{$ref: '#/components/parameters/accountPin'}]
    post:
      tags: [Projects]
      summary: Renew a write lease
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [leaseToken], properties: {leaseToken: {type: string}}}
