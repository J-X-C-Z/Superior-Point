    get:
      tags: [Admin]
      summary: List personal access token metadata
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/offset'}]
      responses:
        '200': {description: Paginated token records}
  /api/v1/admin/mcp/tokens/{id}/revoke:
    post:
      tags: [Admin]
      summary: Revoke a token after recent reauthentication
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      responses:
        '200': {description: Token revoked}
        '401': {$ref: '#/components/responses/Error'}
  /api/v1/admin/audit:
    get:
      tags: [Admin]
      summary: List audit events
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/limit'}, {$ref: '#/components/parameters/offset'}]
      responses:
        '200': {description: Paginated audit events}
  /api/v1/admin/settings:
    get:
      tags: [Admin]
      summary: Read service settings
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Settings}
    patch:
      tags: [Admin]
      summary: Update service settings
      security: [{sessionCookie: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, properties: {siteName: {type: string, minLength: 1, maxLength: 100}, announcement: {type: string, maxLength: 2000}, maxUploadBytes: {type: integer, minimum: 1, maximum: 33554432}, publicRegistration: {const: false}, maintenanceMode: {type: boolean}}}
      responses:
        '200': {description: Settings updated}
  /api/v1/admin/backups:
    get:
      tags: [Admin]
      summary: List configured backups
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Backup metadata}
        '503': {$ref: '#/components/responses/Error'}
    post:
      tags: [Admin]
      summary: Start a backup (requires recent reauthentication)
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Backup operation result}
        '503': {$ref: '#/components/responses/Error'}
  /api/v1/admin/backups/restore-check:
    post:
      tags: [Admin]
      summary: Run configured restore checks (requires recent reauthentication)
      security: [{sessionCookie: []}]
      responses:
        '200': {description: Restore-check results}
        '503': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: sp-session
      description: Development cookie; production uses __Host-sp-session.
    personalAccessToken:
      type: http
      scheme: bearer
      description: Personal token; available scopes are enforced per route.
  parameters:
    id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
    accountPin: {name: X-SP-Account-ID, in: header, required: false, schema: {type: string, format: uuid}, description: Optional account pin for session-authenticated requests; if supplied it must match the signed-in account. Ignored for bearer-token identity.}
    limit: {name: limit, in: query, schema: {type: string, pattern: '^[0-9]{1,3}$'}, description: Pagination limit string; default and maximum enforced by server}
    offset: {name: offset, in: query, schema: {type: string, pattern: '^[0-9]{1,16}$'}, description: Pagination offset string}
  schemas:
    Revision: {type: integer, minimum: 0, maximum: 9007199254740991}
    ClientMutationId: {type: string, minLength: 1, maxLength: 128}
    Error:
      type: object
      properties:
        error: {type: string}
        code: {type: string}
        message: {type: string}
  requestBodies:
    Mutation:
      required: true
      content:
        application/json:
          schema: {type: object, additionalProperties: false, required: [expectedRevision, clientMutationId], properties: {expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}, leaseToken: {type: string}}}
  responses:
    Error:
      description: Request failed with a service error
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
