            schema: {type: object, additionalProperties: false, required: [password], properties: {password: {type: string, minLength: 12, maxLength: 1024, format: password}}}
      responses:
        '200': {description: Password reset}
  /api/v1/admin/projects:
    get:
      tags: [Admin]
      summary: List projects across users
      security: [{sessionCookie: []}]
      parameters:
        - {$ref: '#/components/parameters/limit'}
        - {$ref: '#/components/parameters/offset'}
        - {name: trash, in: query, schema: {type: string, enum: ['true', 'false']}}
      responses:
        '200': {description: Paginated project records}
  /api/v1/admin/projects/{id}/transfer:
    post:
      tags: [Admin]
      summary: Transfer project ownership
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {type: object, additionalProperties: false, required: [newOwnerId, expectedRevision, clientMutationId], properties: {newOwnerId: {type: string, format: uuid}, expectedRevision: {$ref: '#/components/schemas/Revision'}, clientMutationId: {$ref: '#/components/schemas/ClientMutationId'}}}
      responses:
        '200': {description: Project ownership transferred}
        '409': {$ref: '#/components/responses/Error'}
  /api/v1/admin/projects/{id}/trash:
    post:
      tags: [Admin]
      summary: Move any project to trash
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses:
        '200': {description: Project trashed}
  /api/v1/admin/projects/{id}/restore:
    post:
      tags: [Admin]
      summary: Restore any project from trash
      security: [{sessionCookie: []}]
      parameters: [{$ref: '#/components/parameters/id'}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses:
        '200': {description: Project restored}
