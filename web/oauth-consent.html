<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Superior Point · MCP 授权</title><link rel="stylesheet" href="/oauth/oauth-consent.css"><script type="module" src="/oauth/oauth-consent.js"></script></head><body><main><h1>MCP 客户端授权</h1><p id="status" role="status">正在读取授权请求…</p><section id="details" hidden><h2 id="client"></h2><p>客户端名称由客户端自行填写，请核对回调地址。</p><p id="redirect"></p><p id="resource"></p><h3>请求的权限</h3><ul id="scopes"></ul></section><form id="login" hidden><h2>登录 Superior Point</h2><label>用户名<input name="username" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form><form id="consent" hidden><p>请选择允许访问的项目。选择项目时，未选择的项目不会授权。创建项目需要请求创建权限，并明确选择所有本人项目。授权有效期为一小时，可在个人令牌管理中撤销。</p><label><input type="checkbox" id="all-projects">允许访问所有本人项目（包括未来项目）</label><fieldset id="projects"><legend>允许访问的项目</legend></fieldset><button name="approve" value="yes">同意授权</button><button name="approve" value="no">拒绝</button></form></main></body></html>
