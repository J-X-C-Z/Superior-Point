x-app-environment: &app-environment
  SP_ORIGIN: https://${SP_DOMAIN:-sp.jxcz.top}
  SP_BIND: 0.0.0.0
  SP_PORT: 3000
  SP_ASSET_DIR: /app/data/assets
  SP_BACKUP_DIR: /app/data/backups
  SP_PG_BIN: /usr/lib/postgresql/18/bin

services:
  db:
    image: postgres:18-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in deploy/hakari/.env}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in deploy/hakari/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/hakari/.env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
      SP_APP_DB_USER: ${SP_APP_DB_USER:?set SP_APP_DB_USER in deploy/hakari/.env}
      SP_APP_DB_PASSWORD: ${SP_APP_DB_PASSWORD:?set SP_APP_DB_PASSWORD in deploy/hakari/.env}
      SP_MIGRATOR_DB_USER: ${SP_MIGRATOR_DB_USER:?set SP_MIGRATOR_DB_USER in deploy/hakari/.env}
      SP_MIGRATOR_DB_PASSWORD: ${SP_MIGRATOR_DB_PASSWORD:?set SP_MIGRATOR_DB_PASSWORD in deploy/hakari/.env}
      SP_RESTORE_DB_USER: ${SP_RESTORE_DB_USER:?set SP_RESTORE_DB_USER in deploy/hakari/.env}
      SP_RESTORE_DB_PASSWORD: ${SP_RESTORE_DB_PASSWORD:?set SP_RESTORE_DB_PASSWORD in deploy/hakari/.env}
      PGDATA: /var/lib/postgresql/18/docker
    command: ["postgres", "-c", "max_connections=20", "-c", "shared_buffers=48MB", "-c", "work_mem=2MB"]
    volumes:
      - ../../data/postgres:/var/lib/postgresql
      - ./initdb:/docker-entrypoint-initdb.d:ro
    mem_limit: 128m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  app:
    image: superior-point-app:${SP_IMAGE_TAG:-local}
    build:
      context: ../..
      dockerfile: deploy/hakari/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      SP_TRUST_PROXY_HOPS: 1
      SP_HOST_METRICS_FILE: /app/host-metrics/host.json
      DATABASE_URL: postgresql://${SP_APP_DB_USER:?set SP_APP_DB_USER in deploy/hakari/.env}:${SP_APP_DB_PASSWORD:?set SP_APP_DB_PASSWORD in deploy/hakari/.env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in deploy/hakari/.env}
      SP_RESTORE_DATABASE_URL: ${SP_RESTORE_DATABASE_URL:-}
    volumes:
      - type: bind
        source: ../../data/host-metrics
        target: /app/host-metrics
        read_only: true
        bind:
          create_host_path: false
      - ../../data/assets:/app/data/assets
      - ../../data/backups:/app/data/backups
    expose:
      - "3000"
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health/live').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

  migrate:
    image: superior-point-app:${SP_IMAGE_TAG:-local}
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${SP_MIGRATOR_DB_USER:?set SP_MIGRATOR_DB_USER in deploy/hakari/.env}:${SP_MIGRATOR_DB_PASSWORD:?set SP_MIGRATOR_DB_PASSWORD in deploy/hakari/.env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in deploy/hakari/.env}
    command: ["npm", "run", "service:migrate"]

  backup:
    image: superior-point-app:${SP_IMAGE_TAG:-local}
    profiles: ["ops"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-environment
      DATABASE_URL: postgresql://${SP_APP_DB_USER:?set SP_APP_DB_USER in deploy/hakari/.env}:${SP_APP_DB_PASSWORD:?set SP_APP_DB_PASSWORD in deploy/hakari/.env}@db:5432/${POSTGRES_DB:?set POSTGRES_DB in deploy/hakari/.env}
      SP_RESTORE_DATABASE_URL: ${SP_RESTORE_DATABASE_URL:-}
    volumes:
      - ../../data/assets:/app/data/assets
      - ../../data/backups:/app/data/backups
    mem_limit: 384m
    command: ["npm", "run", "service:backup"]

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      SP_DOMAIN: ${SP_DOMAIN:-sp.jxcz.top}
    ports:
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ../../data/caddy:/data
      - ../../data/caddy-config:/config
